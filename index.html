            z-index: 1;
        }

    function parse_args() {
        _args_init = true;
        args = location.href.split("?")[1];

        args.split('&').forEach(function(item) {
            var s = item.split('=');

            }
        };

    function is_background_enabled(bg_name, config) {
        var show = config.show;
        if (typeof show == "undefined") return true;
        if (show == ShowState.Hidden) return false;
        if (show == ShowState.HerizontalOnly) {
            return window.innerWidth / innerHeight > 1.2;
        }
        if (show == ShowState.VerticalOnly) {
            return window.innerHeight / innerWidth > 1.2;
        }
        return true;
    }

    function get_enabled_background_list() {
        var enabled = {};
        Object.keys(background_image_list).forEach(function(bg_name) {
            if (is_background_enabled(bg_name, background_image_list[bg_name])) {
                enabled[bg_name] = background_image_list[bg_name];
            }
        });
        return enabled;
    }

    function pick_background_key() {
        var backgrounds = get_enabled_background_list();
        var backgrounds_names = Object.keys(backgrounds);

        var blur_flag = _args["blur"];
        if (blur_flag === "false" || blur_flag === "0") {
            remove_blur(".season-rel")();
        }

        var bg = _args["background"];
        if (typeof bg != "undefined" && typeof backgrounds[bg] != "undefined") {
            return bg;
        }

        // 随机选择一个背景，使用 localStorage 保证连续两次不重复
        var idx;
        do {
            idx = parseInt(Math.random() * backgrounds_names.length);
            if (typeof window.localStorage != "undefined") {
                var st = window.localStorage;
                var last_id = st.getItem("_last_image_id");
                if (typeof last_id == "undefined" || last_id == null) {
                    idx = 0;
                    st.setItem("_last_image_id", idx);
                    break;
                }
                if (parseInt(last_id) != idx) {
                    st.setItem("_last_image_id", idx);
                    break;
                }
            } else {
                break;
            }
        } while (true);
        return backgrounds_names[idx];
    }

    function apply_background(config) {
        var position = 'center ' + (config.positionY || 'bottom');
        var imageUrl = "url('" + config.image + "')";
        var cacheUrl = "url('" + config.cacheImage + "')";

        document.querySelectorAll(".season-rel.cover.cache").forEach(function(el) {
            el.style.backgroundImage = cacheUrl;
            el.style.backgroundPosition = position;
        });
        document.querySelectorAll(".season-rel.cover:not(.cache)").forEach(function(el) {
            el.style.backgroundImage = imageUrl;
            el.style.backgroundPosition = position;
        });
        document.querySelectorAll(".season-rel.mask").forEach(function(el) {
            el.style.background = config.mask || 'transparent';
        });
    }

        <script>
    function is_null_or_empty_string(str) {
        return typeof str == "undefined" || str == null || str == "";
    }
    
    function write_image_source(dom, conf) {
        var inner_html = "Image: <a href='" + 
            (is_null_or_empty_string(conf.image_url) ? "javascript:void(0)" : conf.image_url) + 
            "'>" + conf.image_name + "</a>";
        if (!is_null_or_empty_string(conf.image_source)) {
            inner_html += " from <a href='" +
                (is_null_or_empty_string(conf.source_url) ? "javascript:void(0)" : conf.source_url) + 
                "'>" + conf.image_source +  "</a>";
        }
        dom.style.display = 'inline-block';
        dom.innerHTML = inner_html;
    }

    function call_additional_action(func) {
        func();
    }
    
    function write_additional_footer() {
        if (typeof season.footer == "undefined" || season.footer == null) {
            return;
        }
        if (typeof season.footer.image_name != "undefined") {
            write_image_source(document.getElementById("additional_info"), season.footer);
        }
        if (typeof season.action == "function") {
            call_additional_action(season.action);
        } else if (typeof season.action == "object") {
            season.action.map(function(f) { call_additional_action(f); });
        }
    }

    write_additional_footer();
        </script>

    <script>
    (function() {
        /** 按设备能力选择涟漪参数（resolution 对 GPU 负载影响最大） */
        function getRipplesOptions() {
            var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (prefersReducedMotion) {
                return null;
            }

            var coarsePointer = window.matchMedia("(pointer: coarse)").matches;
            var narrowViewport = window.matchMedia("(max-width: 768px)").matches;
            var saveData = navigator.connection && navigator.connection.saveData;
            var lowCores = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
            var mobileLike = coarsePointer || narrowViewport || saveData;

            if (mobileLike || lowCores) {
                return {
                    resolution: 256,
                    dropRadius: 12,
                    perturbance: 0.04,
                    interactive: true
                };
            }

            var tabletLike = window.matchMedia("(max-width: 1024px)").matches;
            if (tabletLike) {
                return {
                    resolution: 384,
                    dropRadius: 8,
                    perturbance: 0.045,
                    interactive: true
                };
            }

            return {
                resolution: 512,
                dropRadius: 5,
                perturbance: 0.05,
                interactive: true
            };
        }

        function initRipples($cover, options) {
            try {
                $cover.ripples(options);

                document.addEventListener("visibilitychange", function() {
                    if (!$cover.data("ripples")) {
                        return;
                    }
                    $cover.ripples(document.hidden ? "pause" : "play");
                });
            } catch (e) {
                console.error("WebGL Ripple 效果初始化失败，请检查浏览器是否支持 WebGL", e);
            }
        }

        $(document).ready(function() {
            var $cover = $(".season-rel.cover:not(.cache)");
            var options = getRipplesOptions();
            if (!options || typeof season == "undefined") {
                return;
            }

            // 内联 background-image 时插件可能无法解析，显式传入 imageUrl
            options.imageUrl = season.image;

            var img = new Image();
            img.onload = function() { initRipples($cover, options); };
            img.onerror = function() {
                console.error("背景图加载失败，无法初始化涟漪效果:", season.image);
            };
            img.src = season.image;
        });
    })();
    </script>
